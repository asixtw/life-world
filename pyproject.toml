[project]
name = "lifeworld-local"
version = "0.1.0"
description = "Life World local Python application"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pwdlib[argon2]>=0.2", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
browser = ["playwright>=1.40,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "migrations/*.sql"]
