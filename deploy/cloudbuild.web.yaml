# React main：測試／建置／push 後，通過 IAM 候選檢查才自動發布；不改 IAM。
serviceAccount: projects/life-world-513506/serviceAccounts/lw-build-main@life-world-513506.iam.gserviceaccount.com
# 最多等鎖 15 分鐘；另外保留 30 分鐘供 React build、候選驗證與必要回滾。
timeout: 2700s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  # 已核對 Cloud Run v2 Service URI；PR 尚未 Merge，服務層級 IAM 仍待授權。
  _WEB_API_ORIGIN: 'https://lw-api-main-u5py2jttpa-de.a.run.app'

steps:
  - id: validate-source
    name: ubuntu:24.04
    entrypoint: bash
    args:
      - -ceu
      - |
        test "$PROJECT_ID" = "life-world-513506"
        printf '%s\n' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$$'
        test -f collaboration/ui-kit/package.json
        test -f collaboration/ui-kit/pnpm-lock.yaml
        test -d collaboration/ui-kit/src

  - id: release-safety-tests
    name: python:3.12-slim
    entrypoint: python
    args: ['-m', 'unittest', 'discover', '-s', 'deploy/tests', '-p', 'test_release.py', '-q']

  # 共用 Docker stage cache，分開留下測試與 build 的失敗位置。
  - id: react-tests
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - verify
      - -t
      - lw-ui-verify:$COMMIT_SHA
      - -f
      - collaboration/ui-kit/Dockerfile
      - collaboration/ui-kit

  - id: react-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - build
      - -t
      - lw-ui-build:$COMMIT_SHA
      - -f
      - collaboration/ui-kit/Dockerfile
      - collaboration/ui-kit

  - id: image-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runtime
      - --build-arg
      - VCS_REF=$COMMIT_SHA
      - --build-arg
      - LIFEWORLD_WEB_API_ORIGIN=${_WEB_API_ORIGIN}
      - -t
      - asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-web:${COMMIT_SHA}-${BUILD_ID}
      - -f
      - collaboration/ui-kit/Dockerfile
      - collaboration/ui-kit

  - id: image-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-web:${COMMIT_SHA}-${BUILD_ID}

  - id: deploy-main
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    # 直接使用映像自帶的 Python，不依賴系統 PATH 有 python3。
    entrypoint: /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3
    args:
      - deploy/release.py
      - --component
      - web
      - --commit
      - $COMMIT_SHA
      - --build-id
      - $BUILD_ID
      - --branch
      - $BRANCH_NAME

# 映像由 image-push 明確上傳；不在發布後再用 images 欄位重複 push。
