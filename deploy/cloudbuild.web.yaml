# 只適用獨立 React 候選展示站；不是正式 FastAPI 或資料庫部署。
serviceAccount: projects/life-world-513506/serviceAccounts/lw-build-main@life-world-513506.iam.gserviceaccount.com
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: validate-source
    name: ubuntu:24.04
    entrypoint: bash
    args:
      - -ceu
      - |
        test "$PROJECT_ID" = "life-world-513506"
        printf '%s\n' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$$'
        test -f collaboration/ui-kit/package.json
        test -f collaboration/ui-kit/pnpm-lock.yaml
        test -d collaboration/ui-kit/src

  # 共用 Docker stage cache，分開留下測試與 build 的失敗位置。
  - id: react-tests
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - verify
      - -t
      - lw-ui-verify:$COMMIT_SHA
      - -f
      - collaboration/ui-kit/Dockerfile
      - collaboration/ui-kit

  - id: react-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - build
      - -t
      - lw-ui-build:$COMMIT_SHA
      - -f
      - collaboration/ui-kit/Dockerfile
      - collaboration/ui-kit

  - id: image-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runtime
      - --build-arg
      - VCS_REF=$COMMIT_SHA
      - -t
      - asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-web:${COMMIT_SHA}-${BUILD_ID}
      - -f
      - collaboration/ui-kit/Dockerfile
      - collaboration/ui-kit

  - id: image-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-web:${COMMIT_SHA}-${BUILD_ID}

  - id: deploy-main
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        IMAGE="asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-web"
        DIGEST="$$(gcloud artifacts docker images describe "$${IMAGE}:${COMMIT_SHA}-${BUILD_ID}" --project=life-world-513506 --format='value(image_summary.digest)')"
        printf '%s\n' "$${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$$'
        # 查詢本次建置的唯一 tag，固定以實際 digest 部署。
        gcloud run deploy lw-web-main \
          --project=life-world-513506 \
          --region=asia-east1 \
          --platform=managed \
          --image="$${IMAGE}@$${DIGEST}" \
          --service-account=lw-web-runtime@life-world-513506.iam.gserviceaccount.com \
          --port=8080 \
          --min-instances=0 \
          --max-instances=2 \
          --memory=256Mi \
          --cpu=1 \
          --timeout=60 \
          --concurrency=80 \
          --labels=app=life-world,component=ui-candidate,environment=main,commit-sha=$COMMIT_SHA \
          --quiet

# 明確 push 後才部署；此欄亦讓 Cloud Build 記錄應用映像。
images:
  - asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-web:${COMMIT_SHA}-${BUILD_ID}
