# API main：保留合成測試與容器驗證；正式設定隔離及候選健康檢查失敗時禁止發布。
serviceAccount: projects/life-world-513506/serviceAccounts/lw-build-main@life-world-513506.iam.gserviceaccount.com
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: validate-source
    name: ubuntu:24.04
    entrypoint: bash
    args:
      - -ceu
      - |
        test "$PROJECT_ID" = "life-world-513506"
        printf '%s\n' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$$'
        printf '%s\n' "$BUILD_ID" | grep -Eq '^[0-9a-f-]{36}$$'
        test -f deploy/Dockerfile.api
        mkdir -p .step10-tests
        # 只供此 build 的合成 PG 密碼；不讀 Secret Manager 或 Cloud SQL 密碼。
        printf 'POSTGRES_USER=lw_step10_admin\nPOSTGRES_DB=postgres\nPOSTGRES_PASSWORD=' > .step10-tests/synthetic.env
        od -An -N24 -tx1 /dev/urandom | tr -d ' \n' >> .step10-tests/synthetic.env
        printf '\n' >> .step10-tests/synthetic.env

  - id: release-safety-tests
    name: python:3.12-slim
    entrypoint: python
    args: ['-m', 'unittest', 'discover', '-s', 'deploy/tests', '-p', 'test_release.py', '-q']

  - id: start-synthetic-pg18
    name: gcr.io/cloud-builders/docker
    args: ['run', '-d', '--rm', '--name', 'lw-pg18-tests', '--network', 'cloudbuild', '--env-file', '/workspace/.step10-tests/synthetic.env', 'postgres:18.6', '-c', 'cluster_name=lifeworld-step10-4-synthetic']

  - id: sqlite-and-real-pg18-tests
    name: python:3.12-slim
    entrypoint: bash
    env: ['PYTHONUTF8=1', 'LIFEWORLD_TEST_PG_HOST=lw-pg18-tests', 'LIFEWORLD_TEST_PG_PORT=5432']
    args:
      - -ceu
      - |
        python -m pip install --disable-pip-version-check -r requirements.api-test.lock
        # Node 前端契約測試（LIFEWORLD_NODE）屬於發布測試；用與 web 建置相同的 Node，核對官方 SHA-256 才使用。
        python - <<'PY'
        import hashlib, io, os, tarfile, urllib.request
        data = urllib.request.urlopen('https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz', timeout=120).read()
        if hashlib.sha256(data).hexdigest() != '48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75':
            raise SystemExit('Node archive SHA-256 mismatch; refusing to run frontend contract tests with it')
        with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
            binary = archive.extractfile('node-v24.22.2-linux-x64/bin/node').read()
        with open('.step10-tests/node', 'wb') as target:
            target.write(binary)
        os.chmod('.step10-tests/node', 0o755)
        PY
        export LIFEWORLD_NODE="$$PWD/.step10-tests/node"
        "$$LIFEWORLD_NODE" --version
        python -m pytest tests -q --junitxml=.step10-tests/sqlite.xml
        export LIFEWORLD_TEST_PG_PASSWORD="$$(sed -n 's/^POSTGRES_PASSWORD=//p' .step10-tests/synthetic.env)"
        python scripts/pg_test_bootstrap.py
        LIFEWORLD_TEST_BACKEND=postgresql python -m pytest tests -q --junitxml=.step10-tests/postgres.xml

  - id: api-image-build
    name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'VCS_REF=${COMMIT_SHA}', '-f', 'deploy/Dockerfile.api', '-t', 'asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-api:${COMMIT_SHA}-${BUILD_ID}', '.']

  - id: api-container-verification
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        # Docker builder 沒有 Python；用既有測試 Python container 執行檢查，透過 daemon socket。
        cp "$$(command -v docker)" /workspace/.step10-tests/docker
        docker run --rm --network cloudbuild \
          -v /var/run/docker.sock:/var/run/docker.sock -v /workspace:/workspace -w /workspace \
          --entrypoint python python:3.12-slim scripts/smoke_api_container.py \
          --image asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-api:${COMMIT_SHA}-${BUILD_ID} \
          --network cloudbuild --pg-host lw-pg18-tests --pg-port 5432 \
          --password-env-file .step10-tests/synthetic.env --docker-in-container

  - id: cleanup-synthetic-pg18
    name: gcr.io/cloud-builders/docker
    args: ['rm', '-f', '-v', 'lw-pg18-tests']

  - id: api-image-push
    name: gcr.io/cloud-builders/docker
    args: ['push', 'asia-east1-docker.pkg.dev/life-world-513506/lw-containers/lw-api:${COMMIT_SHA}-${BUILD_ID}']

  - id: deploy-main
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    # 直接使用映像自帶的 Python，不依賴系統 PATH 有 python3。
    entrypoint: /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3
    args:
      - deploy/release.py
      - --component
      - api
      - --commit
      - $COMMIT_SHA
      - --build-id
      - $BUILD_ID
      - --branch
      - $BRANCH_NAME

# api-image-push 已明確上傳；發布是最後一步，不在切流量後再上傳映像。
