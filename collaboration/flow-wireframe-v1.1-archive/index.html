<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Life World｜完整流程 Wireframe</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header><a href="#world" class="brand">✦ Life World</a><span>完整流程 Wireframe · 封測 v1.1</span></header>
  <aside class="notice">獨立互動原型 · 全部使用虛構資料，不連正式 App。歷史封測規格 v1.1（此快照僅保留操作，不附原規格）<strong>「已實作」指 App 已有對應能力；本頁操作仍是本機示範。</strong></aside>
  <section id="night-prompt" aria-label="夜間關懷詢問"></section>
  <div id="feedback" role="status" aria-live="polite"></div>
  <main id="app"></main>
  <nav aria-label="主要導覽" id="nav"></nav>
  <footer><button data-go="settings">夜間設定</button><button data-action="demo">載入虛構示例</button><button data-action="reset">清除本原型資料</button><p>「已安排」代表打算做。草稿、名片與私人模擬不直接增加正式成果。</p></footer>
  <dialog id="source"><h2>資訊來源</h2><p id="source-text"></p><button data-action="close-source">關閉來源</button></dialog>
</body>
</html>
