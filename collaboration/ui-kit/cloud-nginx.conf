server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # API 缺席時明確失敗，不回傳 SPA HTML 冒充 API 成功。
    location = /api { return 404; }
    location ^~ /api/ { return 404; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 避免誤傳隱藏檔與 source map；既有 UI 不需公開原始碼對照。
    location ~ (^|/)\. { return 404; }
    location ~* \.map$ { return 404; }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 缺少靜態資產不應吃到 SPA fallback，也不假設所有素材都有雜湊命名。
    location ~* \.(?:js|mjs|css|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|mp3|wav|ogg|m4a|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
