<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界基底獨立候選：非正式整合</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f2;color:#334431;font:16px system-ui}header,footer{padding:20px}button{padding:10px;margin:4px;border-radius:8px;border:1px solid #526f4d;background:#fffefb;color:#334431}.scene{position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;background:#eaf0e1;isolation:isolate}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}.furniture{position:absolute;width:34%;left:1%;top:46%;}.plant{position:absolute;width:19%;right:0;bottom:1%;z-index:4}.shadow{position:absolute;left:50%;top:76%;width:23%;transform:translate(-50%,-50%);opacity:.55}.lumi{position:absolute;width:112px;height:135px;object-fit:contain;left:50%;top:76%;transform:translate(-50%,-90%);z-index:3}.quiet .furniture,.quiet .plant{filter:brightness(.7) saturate(.8)}.portrait{aspect-ratio:3/4}.portrait .furniture{width:45%;left:-10%;top:51%}.portrait .plant{width:28%;right:-5%}.safe{display:none;position:absolute;left:35%;width:30%;top:55%;height:32%;border:2px dashed #526f4d;z-index:8}.guides .safe{display:block}@media(max-width:600px){.scene{aspect-ratio:16/9}.lumi{transform:translate(-50%,-90%) scale(.85)}.furniture{top:40%;width:27%}.plant{width:15%}.portrait{aspect-ratio:3/4}}
</style><header><h1>世界基底：獨立候選</h1><p>日間／Quiet 共用圖層定位；Lumi 只作尺寸參照，非角色新稿。文字與操作在場景外。</p><button id="mode">切換 Quiet</button><button id="shape">切換直向預覽</button><button id="guide">安全區</button></header><main><div class="scene" id="scene"><img class="base" src="originals/room-day-base.png" alt="日間房間"><img class="furniture" src="layers/furniture-cabinet.png" alt=""><img class="shadow" src="layers/lumi-contact-shadow.png" alt=""><img class="lumi" src="layers/reference-lumi-completion.png" alt="既有 Lumi 尺寸參照"><img class="plant" src="layers/foreground-plant.png" alt=""><div class="safe"></div></div></main><footer><strong>待 Boyi／Jerry 審查，不代表完成正式整合。</strong><p>1280×960／768×1024 是瀏覽器組裝預覽尺寸，不是原生分層繪圖尺寸。背景生成原稿 1448×1086；1920×1440 原稿尚未達成。直向版為同稿裁切與圖層重排，不是獨立直向原畫。Quiet 家具／前景暫採 CSS 調光。</p></footer><script>const s=document.querySelector('#scene');document.querySelector('#mode').onclick=()=>{s.classList.toggle('quiet');const q=s.classList.contains('quiet');s.querySelector('.base').src=`originals/room-${q?'quiet':'day'}-base.png`;s.querySelector('.base').alt=q?'Quiet 房間':'日間房間'};document.querySelector('#shape').onclick=()=>s.classList.toggle('portrait');document.querySelector('#guide').onclick=()=>s.classList.toggle('guides');</script></html>
