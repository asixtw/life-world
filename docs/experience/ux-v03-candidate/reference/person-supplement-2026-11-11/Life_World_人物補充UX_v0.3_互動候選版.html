<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Life World｜人物補充 UX v0.3 設計候選</title>
<style>
:root{--paper:#f7f8f2;--white:#fffefb;--ink:#334431;--muted:#68725f;--green:#526f4d;--mint:#eaf0e1;--line:#e5e9dc;--gold:#b99354;--warn:#faf2de;--danger:#924b43;--shadow:0 14px 42px #3344310b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button,a,input,textarea,select,summary{outline-offset:3px}*:focus-visible{outline:3px solid #89a87d}button{min-height:43px;border:1px solid var(--line);border-radius:12px;background:var(--white);padding:8px 14px;font-weight:600}button:disabled{opacity:.55;cursor:not-allowed}button.primary{border-color:var(--green);background:var(--green);color:white}button.quiet{background:transparent;border:0;color:var(--green);padding:7px 4px;min-height:36px}button.ghost{background:transparent}button.pill{border-radius:999px}.banner{padding:10px 20px;background:#e7eddf;text-align:center;font-size:12px;color:#51674a}.topbar{height:67px;background:var(--white);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 max(24px,calc((100vw - 980px)/2));gap:16px}.logo{font-weight:750;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}.sprout{color:var(--green);font-size:22px}.crumb{font-size:12px;color:var(--muted)}.frame{max-width:1120px;margin:auto;display:grid;grid-template-columns:minmax(0,690px) 250px;gap:35px;padding:32px 25px 45px;justify-content:center}.workflow{min-width:0;max-width:690px;width:100%}.flow-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.progress{display:flex;gap:7px;margin:13px 0 27px}.progress span{height:4px;background:#e4e9de;border-radius:9px;flex:1}.progress .active{background:#88a47d}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;color:#73836b}.heading{font-size:30px;line-height:1.35;letter-spacing:-.02em;margin:9px 0 9px;font-weight:730}.subtitle{font-size:14px;color:var(--muted);margin:0 0 23px}.card{background:var(--white);border:1px solid var(--line);border-radius:21px;padding:23px;box-shadow:var(--shadow);margin:15px 0}.card>h2{font-size:17px;margin:0 0 9px}.section{padding:19px 0;border-top:1px solid var(--line)}.section:first-child{border:0;padding-top:0}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.bold{font-weight:700}.tag{font-size:11px;border-radius:6px;background:var(--mint);color:#4b6544;padding:4px 8px;display:inline-block}.tag.gold{background:#f8edda;color:#8d6e32}.tag.outline{background:transparent;border:1px solid var(--line);color:var(--muted)}.choice{border:1px solid var(--line);padding:14px;border-radius:14px;display:flex;align-items:flex-start;gap:11px;cursor:pointer;margin:9px 0}.choice:has(input:checked){border-color:#9fba95;background:#f0f5eb}.choice b{display:block;font-size:14px}.choice span{font-size:12px;color:var(--muted);display:block}.choice input{accent-color:var(--green);margin-top:5px;width:17px;height:17px}.choice .stack{flex:1}.person{border:1px solid var(--line);border-radius:15px;margin:14px 0;overflow:hidden;background:#fffefb}.person-head{display:flex;gap:11px;align-items:center;padding:15px}.avatar{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;background:#e9eddf;color:var(--green);font-size:18px;font-weight:700}.person-details{flex:1;min-width:0}.person-name{font-weight:700;display:block}.person-role{font-size:12px;color:var(--muted);display:block}.remove{border:0;min-width:34px;background:transparent;color:var(--muted);font-size:20px;padding:2px}.person-actions{border-top:1px solid var(--line);padding:10px 15px;display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between;align-items:center}.person-actions button{font-size:13px}.person-actions select{border:1px solid #d9dfcf;background:#fffefa;border-radius:10px;padding:8px;font-size:13px;min-height:39px}.field{margin:13px 0;display:grid;gap:6px}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea,textarea.review{width:100%;background:#fffefa;border:1px solid #d9dfcf;border-radius:11px;padding:10px 12px;font-size:14px}.field textarea{min-height:85px;resize:vertical}.field small{color:var(--muted)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.info-block{border-radius:12px;background:var(--mint);padding:11px 13px;font-size:12px;color:#52684c}.info-block.warn{background:var(--warn);color:#7d6639}.button-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.subform{border-top:1px solid var(--line);padding:10px 16px 17px;background:#fdfef9}.subform h3{font-size:14px;margin:11px 0 3px}.cta{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}.cta .primary{min-width:170px}.card .review-section{border-top:1px solid var(--line);padding:18px 0}.card .review-section:first-child{border-top:0;padding-top:0}.review-section h2{font-size:16px;margin:0}.review-section p{font-size:13px;margin:6px 0}.linklike{color:var(--green);border:0;background:none;padding:4px 2px;min-height:32px;font-weight:600;font-size:13px}.person-preview{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;display:flex;align-items:center;gap:11px;padding:14px 2px;font-weight:400;background:transparent}.person-preview:last-child{border-bottom:1px solid var(--line)}.person-preview .person-details{line-height:1.5}.person-preview strong{font-size:14px}.arrow{margin-left:auto;color:var(--muted);font-size:20px}.checkline{display:flex;align-items:start;gap:10px;margin:12px 0;font-size:13px}.checkline input{accent-color:var(--green);width:18px;height:18px;margin:3px 0 0;flex:none}.source{padding:12px 15px;border-left:3px solid #c6d7be;background:#f3f5ee;color:#526048;border-radius:0 9px 9px 0;font-size:13px;white-space:pre-wrap}.review{width:100%;min-height:114px;resize:vertical}.footnote{text-align:center;color:var(--muted);font-size:12px;margin:15px 0}.hint{font-size:12px;color:var(--muted)}.aside{position:sticky;top:24px;height:fit-content;padding:22px;background:#f1f3e9;border-radius:18px;border:1px solid var(--line);font-size:13px}.aside h2{font-size:15px;margin:0 0 10px}.aside ol{padding-left:21px;margin:0}.aside li{margin:0 0 13px}.aside hr{border:0;border-top:1px solid #d5dccd;margin:14px 0}.sheet{border:0;padding:0;width:min(520px,100vw);max-height:min(90dvh,790px);border-radius:22px;background:var(--white);box-shadow:0 28px 90px #202f2240;color:var(--ink);overflow:hidden}.sheet::backdrop{background:#2637296b}.sheet-inner{height:min(80dvh,760px);display:flex;flex-direction:column;min-height:0}.sheet-title{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--white);display:flex;justify-content:space-between;gap:8px;align-items:center;flex:none}.sheet-title h2{font-size:18px;margin:0}.sheet-title p{margin:2px 0 0;font-size:12px;color:var(--muted)}.sheet-content{overflow:auto;min-height:0;flex:1;padding:8px 22px 18px;overscroll-behavior:contain}.sheet-footer{padding:13px 22px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--white);flex:none}.sheet-footer .primary{width:100%}.diff-line{margin:11px 0;padding:13px;border:1px solid var(--line);border-radius:12px}.diff-line b{display:block;font-size:13px}.diff-line small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.diff-line .checkline{margin:0}.review-notice{font-size:12px;padding:11px 13px;border-radius:10px;background:#f6f2e6;color:#78673f}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;transition:transform .15s ease,opacity .15s ease;background:#344832;color:white;border-radius:12px;padding:10px 17px;font-size:13px;pointer-events:none;z-index:5;box-shadow:var(--shadow)}.toast.show{transform:translate(-50%,0);opacity:1}.demo-note{background:#f0f2e9;border:1px dashed #cbd5c3;padding:10px 13px;border-radius:10px;color:#64715d;font-size:11px;margin-bottom:17px}.empty{text-align:center;padding:20px 0;color:var(--muted);font-size:13px}.separator{border:0;border-top:1px solid var(--line);margin:13px 0}.not-save{background:#f9f2e2;border-radius:10px;padding:12px 13px;font-size:12px;margin:8px 0}.hidden{display:none!important}
@media(max-width:980px){.frame{display:block;max-width:740px}.aside{position:static;margin-top:25px}}
@media(max-width:680px){.banner{padding:8px 12px}.topbar{height:55px;padding:0 20px}.crumb{display:none}.frame{padding:20px 20px 30px}.card{padding:18px;margin:14px 0;border-radius:18px}.heading{font-size:27px}.aside{display:none}.field-grid{grid-template-columns:1fr}.cta{position:sticky;bottom:0;background:linear-gradient(#f7f8f2e7,#f7f8f2 25%);padding:12px 0 calc(8px + env(safe-area-inset-bottom));z-index:2}.cta button{flex:1}.sheet{width:100vw;max-height:92dvh;position:fixed;bottom:0;left:0;top:auto;border-radius:22px 22px 0 0;margin:0;max-width:none}.sheet-inner{height:min(88dvh,740px)}.sheet-content{padding:6px 18px 14px}.sheet-title{padding:17px 18px}.sheet-footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom))}.toast{width:calc(100% - 34px);text-align:center}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="banner">UX v0.3｜人物資料補充 · 設計候選　<span class="muted">非正式產品，不連接 API 或真實 AI</span></div>
<header class="topbar"><div class="logo"><span class="sprout">✳</span> Life World <span class="crumb">／ 記錄經歷</span></div><div class="small muted">我的小宇宙 <span style="padding:0 8px">／</span> 記錄經歷</div></header>
<div class="frame"><main class="workflow" id="main" aria-live="polite"></main><aside class="aside"><h2>這次設計的原則</h2><ol><li>預設不打斷記錄，想多記一點才展開補充。</li><li>人物資料屬於哪個人，由使用者明確指定。</li><li>第 4 步才確認正式人物資訊，不在第 3 步偷存。</li><li>尚無正式欄位的公司、職稱與生日，不假裝已永久保存。</li></ol><hr><div class="small muted">這是獨立原型，延續 UX v0.3 的顏色與版面。所有人物與經歷都是示例。</div></aside></div>
<dialog class="sheet" id="preview" aria-labelledby="sheet-title"><div class="sheet-inner"><div class="sheet-title"><div><h2 id="sheet-title" tabindex="-1">人物變更預覽</h2><p id="sheet-caption"></p></div><button type="button" id="close-sheet" aria-label="關閉預覽">✕</button></div><div class="sheet-content" id="sheet-content" tabindex="0"></div><div class="sheet-footer"><button type="button" id="finish-sheet" class="primary">完成檢視</button></div></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceText='今天和小安討論學校專題，他提到最近開始喜歡登山，也說公司正在招募新設計師。';
let nextId=3, lastFocus=null;
const state={step:3, related:true, people:[{id:'an',name:'小安',isNew:false,role:'direct',open:false,interest:'',food:'',company:'',job:'',birthday:'',accepted:{interest:false,food:false},origin:'stated_by_person'}],summary:'今天和小安討論了專題進度，也聊到他最近開始喜歡登山。',goal:false,source:sourceText,reviewed:false,addMode:null,newName:''};
const roles={direct:'有直接互動',together:'一起參與，但沒有直接互動',mention:'只在原文提及'};
const evidenceTypes={stated_by_person:'本人當時的說法',observed_by_user:'我在這次經歷中觀察到',documented_source:'文件或其他明確來源'};
function notify(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),2600)}
const personBy=id=>state.people.find(p=>p.id===id);
function frame(){return `<div class="flow-top"><button type="button" class="quiet" data-action="leave">← 離開</button><span>${state.step} / 4</span></div><div class="progress" aria-label="第 ${state.step} 步，共四步">${[1,2,3,4].map(i=>`<span class="${i<=state.step?'active':''}"></span>`).join('')}</div>`}
function personEditor(p){return `<div class="subform" id="editor-${esc(p.id)}"><h3>補充這次了解的資訊</h3><p class="hint">選填。只記錄你實際知道、能從這次經歷核對的內容。</p><div class="field"><label for="interest-${p.id}">興趣／嗜好</label><input id="interest-${p.id}" data-field="interest" data-id="${p.id}" value="${esc(p.interest)}" placeholder="例如：最近開始喜歡登山"><small>這類資料已有人物資訊契約；第 4 步逐項確認。</small></div><div class="field"><label for="food-${p.id}">飲食偏好（選填）</label><input id="food-${p.id}" data-field="food" data-id="${p.id}" value="${esc(p.food)}" placeholder="例如：不吃香菜"></div><div class="field"><label for="origin-${p.id}">這些資訊是怎麼得知的？</label><select id="origin-${p.id}" data-field="origin" data-id="${p.id}">${Object.entries(evidenceTypes).map(([k,v])=>`<option value="${k}" ${p.origin===k?'selected':''}>${v}</option>`).join('')}</select></div><hr class="separator"><h3>人物基本資料（先記為候選）</h3><p class="hint">公司、職稱、生日尚待正式資料契約；本次 Demo 只示範預覽，不會當成已保存欄位。</p><div class="field-grid"><div class="field"><label for="company-${p.id}">公司／組織</label><input id="company-${p.id}" data-field="company" data-id="${p.id}" value="${esc(p.company)}" placeholder="尚未記錄"></div><div class="field"><label for="job-${p.id}">職稱／身分</label><input id="job-${p.id}" data-field="job" data-id="${p.id}" value="${esc(p.job)}" placeholder="尚未記錄"></div></div><div class="field"><label for="birthday-${p.id}">生日（可只填月日）</label><input id="birthday-${p.id}" data-field="birthday" data-id="${p.id}" value="${esc(p.birthday)}" placeholder="例如：4 月 12 日"></div><div class="info-block warn">上述基本資料候選不會寫入正式人物欄位；實際產品必須先完成 Schema 與交易契約，不能以標籤代替。</div><div class="button-row" style="margin-top:14px"><button type="button" data-action="done-edit" data-id="${p.id}" class="primary">完成補充</button><button type="button" data-action="clear-edit" data-id="${p.id}">清除本次補充</button></div></div>`}
function personRow(p){let hasDraft=[p.interest,p.food,p.company,p.job,p.birthday].some(x=>x.trim());return `<div class="person"><div class="person-head"><div class="avatar">${esc([...p.name][0]||'人')}</div><div class="person-details"><span class="person-name">${esc(p.name)} ${p.isNew?'<span class="tag gold">待新增</span>':''}</span><span class="person-role">${esc(roles[p.role])}${hasDraft?' · 本次有補充':''}</span></div><button class="remove" data-action="remove" data-id="${p.id}" aria-label="移除${esc(p.name)}">×</button></div><div class="person-actions"><label class="small" style="flex:1;min-width:150px"><span class="bold">本次關係</span><select style="width:100%;margin-top:4px" data-role="${p.id}" aria-label="${esc(p.name)}本次角色">${Object.entries(roles).map(([key,title])=>`<option value="${key}" ${p.role===key?'selected':''}>${title}</option>`).join('')}</select></label><button type="button" class="quiet" data-action="edit" data-id="${p.id}" aria-expanded="${p.open}" aria-controls="editor-${p.id}">${p.open?'收起補充 ↑':'＋ 補充人物資訊'}</button></div>${p.open?personEditor(p):''}</div>`}
function addPanel(){if(!state.addMode)return '';const choices=[{id:'an',name:'小安'},{id:'yi',name:'怡君'},{id:'ming',name:'小明'}].filter(x=>!state.people.some(p=>p.id===x.id));return `<div class="subform" style="margin-top:14px;border:1px solid var(--line);border-radius:13px"><div class="row between"><h3 style="margin:0">${state.addMode==='existing'?'選擇既有人物':'新增一位人物'}</h3><button type="button" class="quiet" data-action="cancel-add">取消</button></div>${state.addMode==='existing'?`<p class="small muted">示例人物：</p><div class="button-row">${choices.length?choices.map(x=>`<button type="button" data-action="select-existing" data-id="${x.id}">${x.name} ＋</button>`).join(''):'<span class="small muted">沒有其他可選人物。</span>'}</div>`:`<div class="field"><label for="new-name">人物稱呼</label><input id="new-name" maxlength="100" value="${esc(state.newName)}" placeholder="例如：阿哲"></div><button class="primary" type="button" data-action="add-new-commit">加入此人物</button><p class="hint">不會現在建立帳號中的正式人物；需經過第 4 步確認。</p>`}</div>`} 
function step3(){return `${frame()}<div class="eyebrow">PEOPLE IN THIS MOMENT</div><h1 class="heading">這次有和誰互動嗎？</h1><p class="subtitle">有實際互動、一起參與，或只是提到的人，都可以記下。沒有也能直接繼續。</p><section class="card"><label class="choice"><input type="radio" name="related" value="no" ${!state.related?'checked':''}><div class="stack"><b>不關聯人物</b><span>只是自己的日記或目標活動</span></div></label><label class="choice"><input type="radio" name="related" value="yes" ${state.related?'checked':''}><div class="stack"><b>有相關人物</b><span>從這次的經歷逐漸了解他們</span></div></label>${state.related?`<div style="padding-top:12px"><div class="button-row"><button type="button" data-action="add-existing">＋ 選擇既有人物</button><button type="button" class="quiet" data-action="add-new">＋ 新增人物</button></div>${addPanel()}${state.people.map(personRow).join('')}${state.people.length?'':`<div class="empty">目前沒有加入人物，請選擇一位，或切換成不關聯人物。</div>`}<p class="hint">不需要一次填滿人物資料。補充資訊完全選填，所有變更都會留到第 4 步核對。</p></div>`:''}</section><div class="cta"><button type="button" data-action="back-earlier">上一步</button><button type="button" class="primary" data-action="next">前往最後確認 →</button></div><p class="footnote">本 Demo 不會儲存至伺服器，也不會呼叫 AI。</p>`}
function countDraft(p){return [p.interest,p.food,p.company,p.job,p.birthday].filter(x=>x.trim()).length}
function reviewPersonCard(p){let n=countDraft(p),status=p.isNew?'待建立':n?'本次有補充':'僅關聯，不修改';return `<button type="button" class="person-preview" data-action="preview" data-id="${p.id}"><span class="avatar">${esc([...p.name][0]||'人')}</span><span class="person-details"><strong>${esc(p.name)} <span class="tag ${p.isNew?'gold':'outline'}">${status}</span></strong><span class="person-role">${esc(roles[p.role])}${n?' · '+n+' 項待核對':''}</span></span><span class="arrow">›</span></button>`}
function step4(){let people =state.related?state.people:[];return `${frame()}<div class="eyebrow">READY WHEN YOU ARE</div><h1 class="heading">確認這段經歷。</h1><p class="subtitle">只把你確認的內容，放進自己的世界。</p><section class="card"><div class="review-section"><h2>本次經歷摘要</h2><textarea class="review" id="review-summary" aria-label="可編輯經歷摘要">${esc(state.summary)}</textarea><details style="margin-top:8px"><summary>查看原始文字與來源</summary><div class="source">${esc(state.source)}</div></details></div><div class="review-section"><div class="row between"><h2>目標與進度</h2><button type="button" class="linklike" data-action="edit-goal">修改</button></div><p class="muted">本次不關聯目標</p></div><div class="review-section"><div class="row between"><h2>人物關聯</h2><button type="button" class="linklike" data-action="back">修改</button></div>${people.length?people.map(reviewPersonCard).join(''):'<p class="muted">本次沒有相關人物，不新增或修改人物資料。</p>'}${people.length?'<p class="hint">點人物可以查看這次新增／修改的內容與來源。未勾選的資訊不會列入正式人物資料。</p>':''}</div><div class="review-section"><div class="row between"><h2>下一步</h2><span class="small muted">選填</span></div><p class="muted">本次沒有新增後續任務。</p></div></section><div class="info-block" style="margin-top:14px">原文不會被摘要覆寫；人物與目標只在最後確認後正式更新。</div><label class="checkline"><input type="checkbox" id="review-check" ${state.reviewed?'checked':''}><span>我已確認這段經歷，以及本次人物關聯與資訊變更。</span></label><div class="cta"><button type="button" data-action="back">上一步</button><button type="button" class="primary" data-action="confirm" ${!state.reviewed?'disabled':''}>確認這段經歷</button></div><p class="footnote">僅顯示示意成功訊息，不進行實際保存。</p>`}
function render(){document.getElementById('main').innerHTML=state.step===3?step3():step4()}
function supportedFacts(p){return [{key:'interest',label:'興趣／嗜好',value:p.interest},{key:'food',label:'飲食偏好',value:p.food}].filter(x=>x.value.trim())}
function unsupportedFacts(p){return [{label:'公司／組織',value:p.company},{label:'職稱／身分',value:p.job},{label:'生日',value:p.birthday}].filter(x=>x.value.trim())}
function showPreview(id){const p=personBy(id);if(!p)return;lastFocus=document.activeElement;const div=document.getElementById('sheet-content');document.getElementById('sheet-title').textContent=p.name+' · 本次資料預覽';document.getElementById('sheet-caption').textContent=(p.isNew?'待新增人物':'既有人物')+' · '+roles[p.role];let a=supportedFacts(p),b=unsupportedFacts(p);div.innerHTML=`<div class="section"><h3 style="font-size:15px;margin:14px 0 6px">${p.isNew?'人物建立':'人物關聯'}</h3><p class="small">${p.isNew?'最後確認後才建立「'+esc(p.name)+'」；取消不留下孤立人物。':'本次經歷將關聯到「'+esc(p.name)+'」，不會因開啟預覽而修改人物檔案。'}</p><span class="tag">${esc(roles[p.role])}</span></div><div class="section"><div class="row between"><h3 style="font-size:15px;margin:0">確認後可保存的資訊</h3><span class="tag">待人工確認</span></div>${a.length?a.map(x=>`<div class="diff-line"><label class="checkline"><input type="checkbox" data-accept="${x.key}" data-id="${p.id}" ${p.accepted[x.key]?'checked':''}><span><b>${x.label} · ${p.isNew?'新增':'新增一項'}</b><span>${esc(x.value)}</span><small>${esc(evidenceTypes[p.origin])} · 來自本次經歷</small></span></label></div>`).join(''):'<p class="small muted">本次沒有要新增的人物資訊。僅保留人物關聯。</p>'}<details><summary>查看本次經歷原文</summary><div class="source">${esc(state.source)}</div></details></div><div class="section"><h3 style="font-size:15px;margin:0 0 8px">目前不寫入人物檔案</h3>${b.length?b.map(x=>`<div class="not-save"><b>${x.label}</b> · ${esc(x.value)}<br><span class="tiny">此欄位尚無已核准儲存契約，因此不列為「確認後會保存」。</span></div>`).join(''):'<p class="small muted">沒有待處理的額外基本資料。</p>'}</div><div class="section"><button type="button" class="quiet" data-action="back-to-person" data-id="${p.id}">← 返回第 3 步修改此人物</button></div>`;const dialog=document.getElementById('preview');dialog.showModal();document.getElementById('sheet-title').focus()}
function closeSheet(){document.getElementById('preview').close();lastFocus?.focus()}
function addExisting(id){const choices=[{id:'an',name:'小安'},{id:'yi',name:'怡君'},{id:'ming',name:'小明'}];const selected=choices.find(x=>x.id===id);if(!selected||state.people.some(p=>p.id===id))return;state.people.push({id:selected.id,name:selected.name,isNew:false,role:'direct',open:false,interest:'',food:'',company:'',job:'',birthday:'',origin:'stated_by_person',accepted:{interest:false,food:false}});state.related=true;state.addMode=null;state.reviewed=false;render();}
function addNew(){const value=state.newName.trim();if(!value){notify('請先填寫人物稱呼');document.getElementById('new-name')?.focus();return;}if(state.people.some(p=>p.name===value)){notify('已有同名稱呼，請先確認是否為同一人');return;}const id='new-'+nextId++;state.people.push({id,name:value,isNew:true,role:'direct',open:true,interest:'',food:'',company:'',job:'',birthday:'',origin:'stated_by_person',accepted:{interest:false,food:false}});state.related=true;state.addMode=null;state.newName='';state.reviewed=false;render();document.getElementById('interest-'+id)?.focus();}
function go3(id){closeSheet();state.step=3;state.reviewed=false;if(id){for(const p of state.people)p.open=p.id===id;}render();document.querySelector('#editor-'+id)?.scrollIntoView({behavior:'smooth',block:'center'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,p=id?personBy(id):null;if(a==='leave'){notify('此原型不會真的離開或保存；可直接關閉頁面。');return;}if(a==='back-earlier'||a==='edit-goal'){notify('本原型專注第 3、4 步；前兩步保留 UX v0.3 既有設計。');return;}if(a==='add-existing'){state.addMode='existing';render();return;}if(a==='add-new'){state.addMode='new';render();document.getElementById('new-name')?.focus();return;}if(a==='cancel-add'){state.addMode=null;render();return;}if(a==='select-existing')return addExisting(id);if(a==='add-new-commit')return addNew();if(a==='remove'&&p){state.people=state.people.filter(x=>x.id!==id);state.reviewed=false;return render();}if(a==='edit'&&p){p.open=!p.open;return render();}if(a==='done-edit'&&p){p.open=false;return render();}if(a==='clear-edit'&&p){for(const f of ['interest','food','company','job','birthday'])p[f]='';p.accepted={interest:false,food:false};return render();}if(a==='next'){if(state.related&&!state.people.length){notify('請加入人物，或選擇不關聯人物。');return;}state.step=4;state.reviewed=false;render();scrollTo({top:0,behavior:'smooth'});return;}if(a==='back'){state.step=3;state.reviewed=false;render();scrollTo({top:0,behavior:'smooth'});return;}if(a==='preview')return showPreview(id);if(a==='back-to-person')return go3(id);if(a==='confirm'){if(!state.reviewed){notify('請先確認經歷與本次人物資料');return;}notify('設計示意完成：不會實際儲存任何資料。');return;}});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='related'){state.related=t.value==='yes';state.reviewed=false;render();return;}if(t.dataset.role){const p=personBy(t.dataset.role);if(p){p.role=t.value;state.reviewed=false;render();}return;}if(t.dataset.accept){const p=personBy(t.dataset.id);if(p){p.accepted[t.dataset.accept]=t.checked;state.reviewed=false;const cb=document.getElementById('review-check');if(cb){cb.checked=false;const c=document.querySelector('[data-action=confirm]');if(c)c.disabled=true;}}return;}if(t.id==='review-check'){state.reviewed=t.checked;document.querySelector('[data-action="confirm"]').disabled=!state.reviewed;return;}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){const p=personBy(t.dataset.id);if(p){p[t.dataset.field]=t.value;if(['interest','food'].includes(t.dataset.field))p.accepted[t.dataset.field]=false;state.reviewed=false;}return;}if(t.id==='new-name'){state.newName=t.value;return;}if(t.id==='review-summary'){state.summary=t.value;state.reviewed=false;const box=document.querySelector('#review-check');if(box){box.checked=false;document.querySelector('[data-action="confirm"]').disabled=true;}}});
for(const id of ['close-sheet','finish-sheet'])document.getElementById(id).addEventListener('click',closeSheet);
document.getElementById('preview').addEventListener('click',e=>{if(e.target.id==='preview')closeSheet()});
render();
</script>
</body></html>
